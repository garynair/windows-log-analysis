name: winlogs
services:
  loki:
    image: grafana/loki:3.4.2          # pinned known-good; bump after first working run
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"                    # Alloy (Windows) pushes here via WSL localhost forwarding
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    restart: unless-stopped
    mem_limit: 768m

  grafana:
    image: grafana/grafana:11.5.2      # pinned known-good; bump after first working run
    ports:
      - "3001:3000"                    # 3000 is taken by Open WebUI
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on: [loki]
    restart: unless-stopped
    mem_limit: 512m

volumes:
  loki_data:
  grafana_data:
